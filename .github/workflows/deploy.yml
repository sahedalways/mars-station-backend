name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Laravel to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/mars-station-backend
            git pull origin main
            composer install --optimize-autoloader --no-dev
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            npm install && npm run build
            chown -R www-data:www-data /var/www/mars-station-backend
            chmod -R 775 /var/www/mars-station-backend/storage
            chmod -R 775 /var/www/mars-station-backend/bootstrap/cache
            systemctl reload php8.3-fpm
